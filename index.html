<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OutSend - Share PDFs Instantly</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        padding: 0;
        background: #f4f6fa;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      header {
        text-align: center;
        padding: 40px 20px;
      }
      header h1 {
        color: #3b82f6;
        font-size: 36px;
        margin: 0;
      }
      header p {
        color: #555;
        font-size: 16px;
        margin-top: 10px;
      }
      main {
        max-width: 800px;
        padding: 20px;
        text-align: center;
      }
      button {
        padding: 14px 24px;
        font-size: 16px;
        border: none;
        border-radius: 10px;
        background: #3b82f6;
        color: white;
        cursor: pointer;
        margin: 10px;
      }
      button:hover {
        background: #2563eb;
      }
      section {
        margin-top: 40px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>OutSend</h1>
      <p>Securely share PDFs instantly using a 4-character session code.</p>
      <button onclick="window.location.href='download.html'">
        Download OutSend App
      </button>
      <button onclick="window.location.href='session.html'">
        Access Session
      </button>
    </header>

    <main>
      <section>
        <h2>How it Works</h2>
        <p>1. Upload your PDF via the OutSend desktop app.</p>
        <p>2. Receive a unique 4-character session code.</p>
        <p>
          3. Share the code with anyone — they can use it to download the PDF
          securely for 15 minutes.
        </p>
      </section>
    </main>

    <footer style="margin-top: 50px; font-size: 12px; color: #888">
      &copy; 2026 OutSend
    </footer>
  </body>
</html>
