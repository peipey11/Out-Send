<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OutSend - Access Session</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        background: #f4f6fa;
      }
      .card {
        background: white;
        padding: 32px;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        text-align: center;
        max-width: 400px;
        width: 90%;
      }
      h1 {
        color: #3b82f6;
        margin-bottom: 10px;
      }
      p {
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Redirecting...</h1>
      <p>
        If not redirected automatically, <a id="link" href="#">click here</a>.
      </p>
    </div>

    <script>
      // Replace this with your Flask backend session enter page
      const backendSessionUrl = "https://outsend.onrender.com/session/enter";

      // Redirect immediately
      window.location.href = backendSessionUrl;

      // Fallback link
      document.getElementById("link").href = backendSessionUrl;
    </script>
  </body>
</html>
